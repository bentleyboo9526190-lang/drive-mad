<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Drive Mad — 50 Levels</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden; background: #0b0f1a;
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none; touch-action: none;
  }
  canvas { display: block; }
  .coin-icon {
    display: inline-block; width: 14px; height: 14px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #ffe79a 0%, #ffd166 45%, #ff9d00 100%);
    box-shadow: inset 0 0 2px rgba(0,0,0,.3), 0 1px 2px rgba(0,0,0,.35);
    vertical-align: middle; flex-shrink: 0;
  }
  #hud {
    position: fixed; top: 0; left: 0; right: 0; z-index: 5;
    padding: 16px 20px; display: flex; justify-content: space-between;
    align-items: center; pointer-events: none; opacity: 1; transition: opacity .25s ease;
  }
  #hud.hide { opacity: 0; }
  .pill {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 9px 18px; border-radius: 999px;
    background: rgba(8,16,32,.5); border: 1px solid rgba(255,255,255,.15);
    color: #fff; font-weight: 800; font-size: 1rem; letter-spacing: 1px;
    backdrop-filter: blur(8px);
  }
  #level-name { color: #ffd166; }
  .hud-right { display: flex; gap: 8px; }
  #hud-coins-pill { color: #ffd166; }
  #hint {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    z-index: 5; color: rgba(255,255,255,.45); font-size: .85rem;
    letter-spacing: 1.5px; pointer-events: none; white-space: nowrap;
  }
  .overlay {
    position: fixed; inset: 0; z-index: 20;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 26px;
    background: radial-gradient(120% 90% at 50% 25%, rgba(14,30,58,.65) 0%, rgba(4,9,20,.96) 100%);
    transition: opacity .32s ease, visibility .32s; overflow-y: auto;
  }
  .overlay.hide { opacity: 0; visibility: hidden; pointer-events: none; }
  .overlay h1 {
    font-size: clamp(2.5rem, 9vw, 5rem); font-weight: 900; letter-spacing: 4px; line-height: .95;
  }
  #win h1 { color: #39ff14; text-shadow: 0 0 40px rgba(57,255,20,.6); }
  #start-screen h1 {
    color: #fff;
    text-shadow: 0 5px 0 #123456, 0 0 30px rgba(80,200,255,.8), 0 0 70px rgba(80,200,255,.35);
  }
  .tagline {
    margin-top: 14px; color: #b7cbe4; font-size: clamp(.85rem, 2.5vw, 1rem);
    letter-spacing: 1.2px; font-weight: 600; max-width: 440px;
  }
  .btn {
    padding: 16px 48px; font-family: inherit;
    font-size: clamp(1.05rem, 3vw, 1.35rem); font-weight: 900; letter-spacing: 3px;
    border: none; border-radius: 999px; cursor: pointer;
    background: linear-gradient(180deg, #ffe79a 0%, #ffc63d 45%, #ff9d00 100%);
    color: #2a1a04;
    box-shadow: 0 7px 0 #a85f00, 0 14px 32px rgba(255,157,0,.4);
    transition: transform .09s, box-shadow .09s;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 9px 0 #a85f00, 0 18px 38px rgba(255,157,0,.5); }
  .btn:active { transform: translateY(5px); box-shadow: 0 2px 0 #a85f00, 0 6px 16px rgba(255,157,0,.35); }
  .btn-shop {
    background: linear-gradient(180deg, #b8e0ff 0%, #6bb8ff 45%, #3a8ee6 100%);
    color: #0a1a2a;
    box-shadow: 0 7px 0 #1e5a99, 0 14px 32px rgba(58,142,230,.4);
  }
  .btn-shop:hover { box-shadow: 0 9px 0 #1e5a99, 0 18px 38px rgba(58,142,230,.5); }
  .btn-shop:active { box-shadow: 0 2px 0 #1e5a99, 0 6px 16px rgba(58,142,230,.35); }
  .btn-levels {
    background: linear-gradient(180deg, #d4f5c4 0%, #8de07a 45%, #4fb83a 100%);
    color: #0a2a04;
    box-shadow: 0 7px 0 #2a7a1a, 0 14px 32px rgba(79,184,58,.4);
  }
  .btn-levels:hover { box-shadow: 0 9px 0 #2a7a1a, 0 18px 38px rgba(79,184,58,.5); }
  .btn-levels:active { box-shadow: 0 2px 0 #2a7a1a, 0 6px 16px rgba(79,184,58,.35); }
  .btn-back {
    background: linear-gradient(180deg, #d6e2f0 0%, #a6b8cc 45%, #7a8da4 100%);
    color: #0a1a2a;
    box-shadow: 0 7px 0 #4a5a6d, 0 14px 32px rgba(122,141,164,.35);
    font-size: 1rem; padding: 14px 36px;
  }
  .btn-back:hover { box-shadow: 0 9px 0 #4a5a6d, 0 18px 38px rgba(122,141,164,.45); }
  .btn-back:active { box-shadow: 0 2px 0 #4a5a6d, 0 6px 16px rgba(122,141,164,.3); }
  .btn-row {
    margin-top: 32px; display: flex; gap: 14px; flex-wrap: wrap; justify-content: center;
  }
  .btn-row .btn { margin-top: 0; }
  .coins-badge {
    display: inline-flex; align-items: center; gap: 9px;
    padding: 10px 24px; border-radius: 999px;
    background: rgba(255,209,102,.12); border: 1px solid rgba(255,209,102,.45);
    color: #ffd166; font-weight: 800; font-size: 1.15rem; letter-spacing: 1.5px;
    margin-bottom: 22px;
  }
  #loading-container {
    display: flex; flex-direction: column; align-items: center; gap: 16px;
    width: min(320px, 75vw); margin-bottom: 10px;
  }
  #loading-container.hide { display: none; }
  #loading-bar-track {
    width: 100%; height: 8px; border-radius: 4px;
    background: rgba(255,255,255,.1); overflow: hidden;
  }
  #loading-bar {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #ffd166, #ff9d00);
    border-radius: 4px; transition: width .15s ease;
  }
  #loading-text {
    color: #b7cbe4; letter-spacing: 2.5px; font-weight: 700; font-size: .8rem;
  }
  #start-content { display: none; flex-direction: column; align-items: center; }
  #start-content.show { display: flex; }
  .progress-info {
    margin-top: 24px; color: #8fa7c4; font-size: .88rem;
    letter-spacing: 1.8px; font-weight: 700; text-transform: uppercase;
  }
  .progress-info b { color: #ffd166; }
  .shop-panel {
    width: min(680px, 100%); padding: 24px; border-radius: 22px;
    background: rgba(10,18,34,.72); border: 1px solid rgba(255,255,255,.14);
    box-shadow: 0 20px 60px rgba(0,0,0,.55); backdrop-filter: blur(8px);
  }
  .shop-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 22px; flex-wrap: wrap; gap: 12px;
  }
  .shop-title {
    font-size: clamp(1.6rem, 5vw, 2.3rem); letter-spacing: 5px; color: #fff;
    font-weight: 900;
    text-shadow: 0 3px 0 #123456, 0 0 24px rgba(80,200,255,.55);
  }
  .shop-bank {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 9px 20px; border-radius: 999px;
    background: rgba(255,209,102,.12); border: 1px solid rgba(255,209,102,.45);
    color: #ffd166; font-weight: 800; font-size: 1.05rem; letter-spacing: 1px;
  }
  .skin-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
    gap: 12px; margin-bottom: 22px;
    max-height: 55vh; overflow-y: auto; padding: 4px;
  }
  .skin-card {
    background: rgba(255,255,255,.04); border: 2px solid rgba(255,255,255,.1);
    border-radius: 14px; padding: 14px 10px; cursor: pointer;
    transition: all .18s ease; text-align: center; color: #fff;
    display: flex; flex-direction: column; align-items: center;
  }
  .skin-card:hover {
    border-color: rgba(255,209,102,.55); background: rgba(255,255,255,.08);
    transform: translateY(-3px);
  }
  .skin-card.equipped {
    border-color: #39ff14; background: rgba(57,255,20,.1);
    box-shadow: 0 0 20px rgba(57,255,20,.25);
  }
  .skin-card.owned { border-color: rgba(107,184,255,.5); }
  .car-preview {
    position: relative; width: 82px; height: 46px; margin: 0 auto 12px;
    filter: drop-shadow(0 3px 5px rgba(0,0,0,.4));
  }
  .car-cabin {
    position: absolute; bottom: 20px; left: 22px; right: 22px;
    height: 14px; border-radius: 6px 6px 0 0;
  }
  .car-window {
    position: absolute; bottom: 22px; left: 28px; right: 28px;
    height: 8px; border-radius: 3px; opacity: .9;
  }
  .car-body {
    position: absolute; bottom: 6px; left: 4px; right: 4px;
    height: 20px; border-radius: 6px;
  }
  .car-wheel {
    position: absolute; bottom: 0; width: 14px; height: 14px; border-radius: 50%;
    box-shadow: inset 0 0 0 4px #8a8f98;
  }
  .car-wheel-l { left: 12px; }
  .car-wheel-r { right: 12px; }
  .skin-name { font-weight: 800; font-size: .9rem; letter-spacing: 1px; margin-bottom: 6px; }
  .skin-price {
    display: flex; align-items: center; justify-content: center; gap: 5px;
    color: #ffd166; font-weight: 800; font-size: .9rem;
  }
  .skin-price.cant-afford { color: #ff5c6c; }
  .skin-status { font-weight: 900; font-size: .78rem; letter-spacing: 1.5px; }
  .skin-status.owned { color: #6bb8ff; }
  .skin-status.equipped { color: #39ff14; }
  .level-grid {
    display: grid; grid-template-columns: repeat(8, 1fr);
    gap: 8px; max-height: 55vh; overflow-y: auto;
    padding: 4px; margin-bottom: 20px;
  }
  .level-btn {
    aspect-ratio: 1; border-radius: 10px;
    border: 2px solid rgba(255,255,255,.15);
    background: rgba(255,255,255,.05);
    color: #fff; font-weight: 800; font-size: .9rem;
    cursor: pointer; font-family: inherit;
    transition: all .15s; position: relative;
  }
  .level-btn:hover {
    border-color: rgba(255,209,102,.6);
    transform: translateY(-2px); background: rgba(255,255,255,.1);
  }
  .level-btn.cleared {
    background: rgba(57,255,20,.12); border-color: rgba(57,255,20,.5); color: #39ff14;
  }
  .level-btn.cleared::after {
    content: '✓'; position: absolute; top: 2px; right: 4px; font-size: .65rem;
  }
  .level-btn.current {
    border-color: #ffd166;
    box-shadow: 0 0 12px rgba(255,209,102,.4);
    color: #ffd166;
  }
  @media (max-width: 480px) {
    .level-grid { grid-template-columns: repeat(5, 1fr); }
    .skin-grid { grid-template-columns: repeat(2, 1fr); }
    .shop-panel { padding: 16px; }
    .btn { padding: 14px 32px; }
    .btn-row { gap: 10px; }
  }
</style>
</head>
<body>

<div id="hud" class="hide">
  <div class="pill" id="level-name">LEVEL 1/50</div>
  <div class="hud-right">
    <div class="pill" id="hud-coins-pill"><span class="coin-icon"></span><span id="hud-coins">0</span></div>
    <div class="pill">R — RESTART</div>
  </div>
</div>
<div id="hint">→ / D accelerate &nbsp;·&nbsp; ← / A brake &amp; reverse &nbsp;·&nbsp; same keys tilt in air</div>

<div id="start-screen" class="overlay">
  <div id="loading-container">
    <div id="loading-bar-track"><div id="loading-bar"></div></div>
    <div id="loading-text">LOADING…</div>
  </div>
  <div id="start-content">
    <div class="coins-badge">
      <span class="coin-icon"></span>
      <span id="start-coins">0</span>
    </div>
    <h1>DRIVE<br>MAD</h1>
    <p class="tagline">50 levels of physics chaos. Beat levels to earn coins. Buy skins. Try not to flip.</p>
    <div class="btn-row">
      <button class="btn" id="play-btn">PLAY</button>
      <button class="btn btn-levels" id="levels-btn">LEVELS</button>
      <button class="btn btn-shop" id="shop-btn">SHOP</button>
    </div>
    <div class="progress-info" id="progress-info"></div>
  </div>
</div>

<div id="levels-screen" class="overlay hide">
  <div class="shop-panel">
    <div class="shop-header">
      <div class="shop-title" style="font-size:clamp(1.4rem,4.5vw,2rem)">LEVELS</div>
      <div class="shop-bank">
        <span class="coin-icon"></span>
        <span id="levels-coins">0</span>
      </div>
    </div>
    <div class="level-grid" id="level-grid"></div>
    <button class="btn btn-back" id="levels-back">BACK</button>
  </div>
</div>

<div id="shop-screen" class="overlay hide">
  <div class="shop-panel">
    <div class="shop-header">
      <div class="shop-title">SHOP</div>
      <div class="shop-bank">
        <span class="coin-icon"></span>
        <span id="shop-coins">0</span>
      </div>
    </div>
    <div class="skin-grid" id="skin-grid"></div>
    <button class="btn btn-back" id="shop-back">BACK</button>
  </div>
</div>

<div id="win" class="overlay hide">
  <h1>CLEARED</h1>
  <p id="win-sub" class="tagline">Nice driving.</p>
  <p id="win-coins" class="tagline" style="color:#ffd166;font-weight:800;letter-spacing:2px"></p>
  <div class="btn-row">
    <button class="btn" id="next-btn">NEXT LEVEL</button>
    <button class="btn btn-back" id="menu-btn">MENU</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>
<script>
const { Engine, Composite, Bodies, Body, Constraint, Events, Vector } = Matter;

const engine = Engine.create({ positionIterations: 10, velocityIterations: 8 });
engine.gravity.y = 1;
const world = engine.world;

const canvas = document.createElement('canvas');
document.body.appendChild(canvas);
const ctx = canvas.getContext('2d');
function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
addEventListener('resize', resize); resize();

const SK = {
  coins: 'dm_coins_v2', owned: 'dm_owned_v2', equipped: 'dm_equipped_v2',
  cleared: 'dm_cleared_v2', current: 'dm_current_v2'
};

let coins = Number(localStorage.getItem(SK.coins) || 0);
let ownedSkins = (() => {
  try { const v = JSON.parse(localStorage.getItem(SK.owned) || '["orange"]'); return Array.isArray(v) && v.length ? v : ['orange']; }
  catch { return ['orange']; }
})();
let equippedSkinId = localStorage.getItem(SK.equipped) || 'orange';
let clearedLevels = (() => {
  try { return new Set(JSON.parse(localStorage.getItem(SK.cleared) || '[]')); }
  catch { return new Set(); }
})();
let lastLevel = Number(localStorage.getItem(SK.current) || 0);
if (!ownedSkins.includes('orange')) ownedSkins.push('orange');

function saveStorage() {
  localStorage.setItem(SK.coins, String(coins));
  localStorage.setItem(SK.owned, JSON.stringify(ownedSkins));
  localStorage.setItem(SK.equipped, equippedSkinId);
  localStorage.setItem(SK.cleared, JSON.stringify([...clearedLevels]));
  localStorage.setItem(SK.current, String(lastLevel));
}

const SKINS = [
  { id: 'orange', name: 'Classic', price: 0,  body: '#e85d3a', accent: '#a83a1e', glass: '#9fe8ff' },
  { id: 'blue',   name: 'Ocean',   price: 2,  body: '#3b7dd9', accent: '#1d4a8a', glass: '#9fe8ff' },
  { id: 'green',  name: 'Jungle',  price: 3,  body: '#2fbf8f', accent: '#1a7a5a', glass: '#9fe8ff' },
  { id: 'red',    name: 'Ferrari', price: 5,  body: '#d93b4a', accent: '#8a1a2a', glass: '#9fe8ff' },
  { id: 'purple', name: 'Nebula',  price: 8,  body: '#a020f0', accent: '#6a1090', glass: '#ffccff' },
  { id: 'gold',   name: 'Royal',   price: 12, body: '#ffd700', accent: '#b8860b', glass: '#ffffcc' },
  { id: 'chrome', name: 'Chrome',  price: 15, body: '#c0c8d0', accent: '#6a7080', glass: '#ffffff' },
  { id: 'neon',   name: 'Neon',    price: 20, body: '#39ff14', accent: '#1a8a0a', glass: '#aaffaa' }
];
function getEquippedSkin() { return SKINS.find(s => s.id === equippedSkinId) || SKINS[0]; }

const THEMES = [
  { bg1:'#1a2740', bg2:'#2d4a6b', bg3:'#4a6b8a', sky:'rgba(20,35,55,0.55)',
    ground:'#2f3542', ramp:'#3a4250', platform:'#3a4250',
    mover:'#6b8e6b', falling:'#ff5c6c', bouncy:'#ff66cc', narrow:'#4a5568' },
  { bg1:'#4a1a2a', bg2:'#7a3a4a', bg3:'#c97a5a', sky:'rgba(60,20,30,0.55)',
    ground:'#3a2030', ramp:'#4a2a3a', platform:'#4a2a3a',
    mover:'#8a5a4a', falling:'#ff4a5a', bouncy:'#ff88aa', narrow:'#6a4a5a' },
  { bg1:'#0a0a1a', bg2:'#1a1a3a', bg3:'#3a3a6a', sky:'rgba(10,10,30,0.7)',
    ground:'#1a1a2a', ramp:'#2a2a3a', platform:'#2a2a3a',
    mover:'#4a4a7a', falling:'#ff3a5a', bouncy:'#aa66ff', narrow:'#3a3a5a' },
  { bg1:'#1a3a1a', bg2:'#2d5a3a', bg3:'#5a8a5a', sky:'rgba(20,40,20,0.55)',
    ground:'#2a3a2a', ramp:'#3a4a3a', platform:'#3a4a3a',
    mover:'#6b8e6b', falling:'#ff6a4a', bouncy:'#ffcc44', narrow:'#4a5a4a' },
  { bg1:'#5a2a1a', bg2:'#8a4a2a', bg3:'#c98a4a', sky:'rgba(60,30,20,0.55)',
    ground:'#4a2a1a', ramp:'#5a3a2a', platform:'#5a3a2a',
    mover:'#a86a3a', falling:'#ff4a2a', bouncy:'#ffcc44', narrow:'#6a4a2a' },
  { bg1:'#1a3a4a', bg2:'#3a5a7a', bg3:'#7aaaba', sky:'rgba(20,40,55,0.55)',
    ground:'#2a3a4a', ramp:'#3a4a5a', platform:'#3a4a5a',
    mover:'#5a8a9a', falling:'#ff4a6a', bouncy:'#aaffee', narrow:'#4a5a6a' },
  { bg1:'#2a0a0a', bg2:'#4a1a0a', bg3:'#8a3a1a', sky:'rgba(40,10,10,0.65)',
    ground:'#2a1a1a', ramp:'#3a2a2a', platform:'#3a2a2a',
    mover:'#6a3a2a', falling:'#ff2a2a', bouncy:'#ffaa44', narrow:'#4a2a2a' },
  { bg1:'#4a1a3a', bg2:'#7a3a5a', bg3:'#c97a9a', sky:'rgba(60,20,40,0.55)',
    ground:'#3a2030', ramp:'#5a3040', platform:'#5a3040',
    mover:'#aa4a88', falling:'#ff2a6a', bouncy:'#aaffaa', narrow:'#6a4050' },
  { bg1:'#1a2a0a', bg2:'#3a5a1a', bg3:'#6a8a2a', sky:'rgba(20,40,10,0.55)',
    ground:'#2a3a1a', ramp:'#3a4a2a', platform:'#3a4a2a',
    mover:'#6a8a3a', falling:'#ff5a2a', bouncy:'#ccff44', narrow:'#4a5a2a' },
  { bg1:'#0a0a2a', bg2:'#1a1a4a', bg3:'#3a2a6a', sky:'rgba(10,10,40,0.7)',
    ground:'#1a1a3a', ramp:'#2a2a4a', platform:'#2a2a4a',
    mover:'#4a3a8a', falling:'#ff3aaa', bouncy:'#88ddff', narrow:'#2a2a5a' }
];
let currentTheme = THEMES[0];

const CAM_ZOOM = 0.85;
const camera = { x: 0, y: 0 };
let car = null, carParts = null, flag = null;
let levelIndex = 0, won = false, grounded = false;
let gameActive = false;
const keys = { right: false, left: false };

function createCar(x, y) {
  const group = Body.nextGroup(true);
  const chassis = Bodies.rectangle(x, y, 84, 26, {
    collisionFilter: { group }, chamfer: { radius: 9 },
    density: 0.0022, friction: 0.15, frictionAir: 0.008, restitution: 0.05
  });
  const wOpts = {
    collisionFilter: { group }, friction: 1.4, frictionStatic: 1.6,
    frictionAir: 0.005, density: 0.0016, restitution: 0.05
  };
  const wheelA = Bodies.circle(x - 29, y + 21, 14, wOpts);
  const wheelB = Bodies.circle(x + 29, y + 21, 14, wOpts);
  const axleA = Constraint.create({
    bodyA: chassis, pointA: { x: -29, y: 14 },
    bodyB: wheelA, pointB: { x: 0, y: 0 },
    stiffness: 0.95, length: 0, render: { visible: false }
  });
  const axleB = Constraint.create({
    bodyA: chassis, pointA: { x: 29, y: 14 },
    bodyB: wheelB, pointB: { x: 0, y: 0 },
    stiffness: 0.95, length: 0, render: { visible: false }
  });
  const compound = Composite.create({ label: 'Car' });
  Composite.add(compound, [chassis, wheelA, wheelB, axleA, axleB]);
  Composite.add(world, compound);
  return { chassis, wheelA, wheelB, compound };
}

const staticBodies = [];
const dynamicProps = [];
const fallingPlats = [];

function addStatic(body, color) {
  body.render = body.render || {};
  body.render.fillStyle = color || currentTheme.ramp;
  staticBodies.push(body);
  Composite.add(world, body);
  return body;
}
function ground(x, y, w, h) {
  return addStatic(Bodies.rectangle(x, y, w, h, { isStatic: true, friction: 1, restitution: 0 }), currentTheme.ground);
}
function platform(x, y, w, h) {
  return addStatic(Bodies.rectangle(x, y, w || 160, h || 18, { isStatic: true, friction: 1, restitution: 0 }), currentTheme.platform);
}
function ramp(x1, y1, x2, y2, t) {
  const cx = (x1 + x2) / 2, cy = (y1 + y2) / 2;
  const len = Math.hypot(x2 - x1, y2 - y1);
  const angle = Math.atan2(y2 - y1, x2 - x1);
  return addStatic(Bodies.rectangle(cx, cy, len, t || 20, { isStatic: true, friction: 1, restitution: 0, angle }), currentTheme.ramp);
}
function bouncyPad(x, y, w) {
  const b = Bodies.rectangle(x, y, w || 80, 6, { isStatic: true, friction: 0.6, restitution: 0, label: 'bouncy' });
  addStatic(b, currentTheme.bouncy);
  b.isBouncy = true;
  return b;
}
function moverH(x, baseY, w, amp, speed, phase) {
  const p = Bodies.rectangle(x, baseY, w, 18, { isStatic: true, friction: 1, restitution: 0 });
  addStatic(p, currentTheme.mover);
  const ph = phase || 0;
  dynamicProps.push({ body: p, update(t) { Body.setPosition(p, { x: x + Math.sin(t * speed + ph) * amp, y: baseY }); } });
  return p;
}
function moverV(x, baseY, w, amp, speed) {
  const p = Bodies.rectangle(x, baseY, w, 18, { isStatic: true, friction: 1, restitution: 0 });
  addStatic(p, currentTheme.mover);
  dynamicProps.push({ body: p, update(t) { Body.setPosition(p, { x: x, y: baseY + Math.sin(t * speed) * amp }); } });
  return p;
}
function fallingPlat(x, y, w) {
  const p = Bodies.rectangle(x, y, w || 120, 16, { isStatic: true, friction: 1, restitution: 0, label: 'falling' });
  p.fallingStart = null; p.origY = y;
  addStatic(p, currentTheme.falling);
  fallingPlats.push(p);
  return p;
}
function narrowBridge(startX, y, count, gap) {
  const g = gap || 6, w = 42;
  for (let i = 0; i < (count || 4); i++) {
    const bx = startX + i * (w + g);
    addStatic(Bodies.rectangle(bx, y, w, 14, { isStatic: true, friction: 1, restitution: 0 }), currentTheme.narrow);
  }
}
function seesaw(x, y, w) {
  const base = Bodies.polygon(x, y + 34, 3, 28, { isStatic: true, angle: -Math.PI / 6 });
  addStatic(base, '#5a6270');
  const plank = Bodies.rectangle(x, y, w, 16, { friction: 1, density: 0.003, restitution: 0 });
  plank.render = { fillStyle: '#a87040' };
  Composite.add(world, plank);
  Composite.add(world, Constraint.create({
    pointA: { x, y }, bodyB: plank, pointB: { x: 0, y: 0 },
    stiffness: 1, length: 0, render: { visible: false }
  }));
  dynamicProps.push({ body: plank, update() {
    const MAX = 0.07;
    if (plank.angle > MAX)  { Body.setAngle(plank, MAX);  Body.setAngularVelocity(plank, 0); }
    if (plank.angle < -MAX) { Body.setAngle(plank, -MAX); Body.setAngularVelocity(plank, 0); }
  }});
}
function createFlag(x, y) {
  flag = Bodies.rectangle(x, y, 20, 90, { isStatic: true, isSensor: true, render: { visible: false } });
  staticBodies.push(flag);
  Composite.add(world, flag);
}
function spawnCar(x, y) { carParts = createCar(x, y); car = carParts.chassis; }

function buildLevel(parts) {
  for (const a of parts) {
    switch (a[0]) {
      case 'g': ground(a[1], a[2], a[3], a[4]); break;
      case 'p': platform(a[1], a[2], a[3], a[4]); break;
      case 'r': ramp(a[1], a[2], a[3], a[4], a[5]); break;
      case 'b': bouncyPad(a[1], a[2], a[3]); break;
      case 'mh': moverH(a[1], a[2], a[3], a[4], a[5], a[6]); break;
      case 'mv': moverV(a[1], a[2], a[3], a[4], a[5]); break;
      case 'fp': fallingPlat(a[1], a[2], a[3]); break;
      case 'nb': narrowBridge(a[1], a[2], a[3], a[4]); break;
      case 'saw': seesaw(a[1], a[2], a[3]); break;
      case 'f': createFlag(a[1], a[2]); break;
      case 's': spawnCar(a[1], a[2]); break;
    }
  }
}

function loadLevel(index) {
  levelIndex = index;
  lastLevel = index;
  saveStorage();
  won = false;
  gameActive = true;

  const def = LEVEL_DATA[index];
  currentTheme = THEMES[def[0] % THEMES.length];

  document.getElementById('level-name').textContent = `LEVEL ${index + 1}/${LEVEL_DATA.length} — ${def[1]}`;
  document.getElementById('hud').classList.remove('hide');

  Engine.clear(engine);
  Composite.clear(world, false);
  world.bodies.length = 0;
  world.constraints.length = 0;
  world.composites.length = 0;
  staticBodies.length = 0;
  dynamicProps.length = 0;
  fallingPlats.length = 0;
  car = null; carParts = null; flag = null; grounded = false;

  buildLevel(def[2]);

  if (car) {
    camera.x = car.position.x;
    camera.y = car.position.y - 40;
  }
  updateAllCoins();
}

function updateAllCoins() {
  document.getElementById('start-coins').textContent = coins;
  document.getElementById('shop-coins').textContent = coins;
  document.getElementById('hud-coins').textContent = coins;
  document.getElementById('levels-coins').textContent = coins;
}
function updateProgressInfo() {
  document.getElementById('progress-info').innerHTML =
    `CLEARED <b>${clearedLevels.size}</b> / ${LEVEL_DATA.length}`;
}
function hideAllOverlays() {
  ['start-screen', 'shop-screen', 'levels-screen', 'win'].forEach(id => {
    document.getElementById(id).classList.add('hide');
  });
}
function showStartScreen() {
  gameActive = false;
  document.getElementById('hud').classList.add('hide');
  hideAllOverlays();
  document.getElementById('start-screen').classList.remove('hide');
  updateAllCoins();
  updateProgressInfo();
}

let loadProgress = 0;
const loadTimer = setInterval(() => {
  loadProgress += 4 + Math.random() * 6;
  if (loadProgress >= 100) {
    loadProgress = 100;
    clearInterval(loadTimer);
    setTimeout(() => {
      document.getElementById('loading-container').classList.add('hide');
      document.getElementById('start-content').classList.add('show');
      updateAllCoins();
      updateProgressInfo();
    }, 180);
  }
  document.getElementById('loading-bar').style.width = loadProgress + '%';
}, 30);

function renderLevelGrid() {
  const grid = document.getElementById('level-grid');
  grid.innerHTML = '';
  for (let i = 0; i < LEVEL_DATA.length; i++) {
    const btn = document.createElement('button');
    btn.className = 'level-btn';
    btn.textContent = i + 1;
    if (clearedLevels.has(i)) btn.classList.add('cleared');
    if (i === lastLevel) btn.classList.add('current');
    btn.addEventListener('click', () => {
      hideAllOverlays();
      loadLevel(i);
    });
    grid.appendChild(btn);
  }
  updateAllCoins();
}
document.getElementById('levels-btn').addEventListener('click', () => {
  hideAllOverlays();
  renderLevelGrid();
  document.getElementById('levels-screen').classList.remove('hide');
});
document.getElementById('levels-back').addEventListener('click', showStartScreen);

function renderShop() {
  const grid = document.getElementById('skin-grid');
  grid.innerHTML = '';
  for (const skin of SKINS) {
    const owned = ownedSkins.includes(skin.id);
    const equipped = equippedSkinId === skin.id;

    const card = document.createElement('div');
    card.className = 'skin-card';
    if (equipped) card.classList.add('equipped');
    else if (owned) card.classList.add('owned');

    card.innerHTML = `
      <div class="car-preview">
        <div class="car-cabin" style="background:${skin.accent}"></div>
        <div class="car-window" style="background:${skin.glass}"></div>
        <div class="car-body" style="background:${skin.body}"></div>
        <div class="car-wheel car-wheel-l" style="background:#1a1a1a"></div>
        <div class="car-wheel car-wheel-r" style="background:#1a1a1a"></div>
      </div>
      <div class="skin-name">${skin.name}</div>
      ${ equipped
        ? `<div class="skin-status equipped">EQUIPPED</div>`
        : owned
          ? `<div class="skin-status owned">TAP TO EQUIP</div>`
          : `<div class="skin-price ${coins < skin.price ? 'cant-afford' : ''}"><span class="coin-icon"></span>${skin.price}</div>` }
    `;

    card.addEventListener('click', () => {
      if (owned) {
        equippedSkinId = skin.id;
        saveStorage();
        renderShop();
      } else if (coins >= skin.price) {
        coins -= skin.price;
        ownedSkins.push(skin.id);
        equippedSkinId = skin.id;
        saveStorage();
        updateAllCoins();
        renderShop();
      }
    });
    grid.appendChild(card);
  }
  updateAllCoins();
}
document.getElementById('shop-btn').addEventListener('click', () => {
  hideAllOverlays();
  renderShop();
  document.getElementById('shop-screen').classList.remove('hide');
});
document.getElementById('shop-back').addEventListener('click', showStartScreen);

document.getElementById('play-btn').addEventListener('click', () => {
  hideAllOverlays();
  loadLevel(lastLevel);
});
document.getElementById('next-btn').addEventListener('click', () => {
  hideAllOverlays();
  if (levelIndex < LEVEL_DATA.length - 1) loadLevel(levelIndex + 1);
  else loadLevel(0);
});
document.getElementById('menu-btn').addEventListener('click', showStartScreen);

addEventListener('keydown', (e) => {
  if (!gameActive) return;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
  if (e.key === 'ArrowLeft'  || e.key === 'a' || e.key === 'A') keys.left  = true;
  if (e.key === 'r' || e.key === 'R') loadLevel(levelIndex);
  if (['ArrowLeft','ArrowRight'].includes(e.key)) e.preventDefault();
}, { passive: false });
addEventListener('keyup', (e) => {
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
  if (e.key === 'ArrowLeft'  || e.key === 'a' || e.key === 'A') keys.left  = false;
});

function updateTouch(e) {
  let L = false, R = false;
  const rect = canvas.getBoundingClientRect();
  for (const t of e.touches) {
    if ((t.clientX - rect.left) < rect.width / 2) L = true; else R = true;
  }
  keys.left = L; keys.right = R;
}
canvas.addEventListener('touchstart', updateTouch, { passive: true });
canvas.addEventListener('touchmove',  updateTouch, { passive: true });
canvas.addEventListener('touchend', (e) => {
  if (e.touches.length === 0) { keys.left = false; keys.right = false; }
  else updateTouch(e);
}, { passive: true });

Events.on(engine, 'beforeUpdate', () => { grounded = false; });

Events.on(engine, 'collisionActive', (event) => {
  if (!carParts) return;
  const { chassis, wheelA, wheelB } = carParts;
  for (const pair of event.pairs) {
    const a = pair.bodyA, b = pair.bodyB;
    const carSide = (a === chassis || a === wheelA || a === wheelB || b === chassis || b === wheelB || b === wheelA);
    if (!carSide) continue;
    const other = (a === chassis || a === wheelA || a === wheelB) ? b : a;
    if (other.isStatic) grounded = true;
  }
});

Events.on(engine, 'collisionStart', (event) => {
  if (!carParts) return;
  const { chassis, wheelA, wheelB } = carParts;
  for (const pair of event.pairs) {
    const { bodyA, bodyB } = pair;
    const other = (bodyA === chassis || bodyA === wheelA || bodyA === wheelB) ? bodyB :
                  (bodyB === chassis || bodyB === wheelA || bodyB === wheelB) ? bodyA : null;
    if (!other) continue;
    if (other.label === 'falling' && !other.fallingStart) {
      other.fallingStart = performance.now();
    }
    if (other.isBouncy && (!other.bounceCooldown || performance.now() - other.bounceCooldown > 250)) {
      other.bounceCooldown = performance.now();
      const LAUNCH = 20;
      const NEW_VX = Math.max(chassis.velocity.x, 3.5);
      Body.setVelocity(chassis, { x: NEW_VX, y: -LAUNCH });
      Body.setVelocity(wheelA, { x: NEW_VX, y: -LAUNCH });
      Body.setVelocity(wheelB, { x: NEW_VX, y: -LAUNCH });
    }
  }
});

const DRIVE_FORCE = 0.055;
const REVERSE_FORCE = 0.04;
const AIR_TILT = 0.006;
const MAX_SPEED = 4.5;

function applyControls() {
  if (!carParts) return;
  const { chassis, wheelA, wheelB } = carParts;
  if (grounded) {
    const dirX = Math.cos(chassis.angle);
    const dirY = Math.sin(chassis.angle);
    if (keys.right) {
      Body.applyForce(chassis, chassis.position, { x: dirX * DRIVE_FORCE, y: dirY * DRIVE_FORCE });
      Body.setAngularVelocity(wheelA, wheelA.angularVelocity + 0.022);
      Body.setAngularVelocity(wheelB, wheelB.angularVelocity + 0.022);
    }
    if (keys.left) {
      Body.applyForce(chassis, chassis.position, { x: -dirX * REVERSE_FORCE, y: -dirY * REVERSE_FORCE });
      Body.setAngularVelocity(wheelA, wheelA.angularVelocity - 0.015);
      Body.setAngularVelocity(wheelB, wheelB.angularVelocity - 0.015);
    }
  } else {
    if (keys.right) Body.setAngularVelocity(chassis, chassis.angularVelocity + AIR_TILT);
    if (keys.left)  Body.setAngularVelocity(chassis, chassis.angularVelocity - AIR_TILT);
  }
  if (grounded && chassis.speed > MAX_SPEED) {
    Body.setVelocity(chassis, Vector.mult(chassis.velocity, MAX_SPEED / chassis.speed));
  }
}

function checkWin() {
  if (won || !car || !flag || !gameActive) return;
  const dx = car.position.x - flag.position.x;
  const dy = car.position.y - flag.position.y;
  if (Math.abs(dx) < 50 && Math.abs(dy) < 70) {
    won = true;
    gameActive = false;
    document.getElementById('hud').classList.add('hide');

    const firstClear = !clearedLevels.has(levelIndex);
    if (firstClear) {
      clearedLevels.add(levelIndex);
      coins += 1;
      saveStorage();
      document.getElementById('win-coins').textContent = '+1 COIN';
      document.getElementById('win-coins').style.color = '#ffd166';
    } else {
      document.getElementById('win-coins').textContent = 'ALREADY CLEARED';
      document.getElementById('win-coins').style.color = '#8fa7c4';
    }
    updateAllCoins();

    document.getElementById('win-sub').textContent = `LEVEL ${levelIndex + 1} — ${LEVEL_DATA[levelIndex][1]}`;
    document.getElementById('next-btn').textContent =
      (levelIndex < LEVEL_DATA.length - 1) ? 'NEXT LEVEL' : 'PLAY AGAIN';
    document.getElementById('win').classList.remove('hide');
  }
}

function updateFallingPlatforms(now) {
  for (const p of fallingPlats) {
    if (p.fallingStart) {
      const elapsed = now - p.fallingStart;
      if (elapsed > 600) {
        Body.setPosition(p, { x: p.position.x, y: p.origY + (elapsed - 600) * 0.35 });
      }
    }
  }
}

function updateCamera() {
  if (!car) return;
  camera.x += (car.position.x - camera.x) * 0.08;
  camera.y += ((car.position.y - 40) - camera.y) * 0.08;
}

function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, canvas.height);
  g.addColorStop(0, currentTheme.bg1);
  g.addColorStop(0.6, currentTheme.bg2);
  g.addColorStop(1, currentTheme.bg3);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.save();
  ctx.translate(canvas.width / 2, canvas.height / 2);
  ctx.scale(CAM_ZOOM, CAM_ZOOM);
  ctx.translate(-camera.x * 0.2, -camera.y * 0.2);
  ctx.fillStyle = currentTheme.sky;
  for (let i = -2; i < 15; i++) {
    const hx = i * 300, hy = 120;
    ctx.beginPath();
    ctx.moveTo(hx - 200, 400);
    ctx.quadraticCurveTo(hx, hy, hx + 200, 400);
    ctx.fill();
  }
  ctx.restore();
}

function drawBody(body) {
  if (!body.vertices) return;
  ctx.beginPath();
  ctx.moveTo(body.vertices[0].x, body.vertices[0].y);
  for (let i = 1; i < body.vertices.length; i++) ctx.lineTo(body.vertices[i].x, body.vertices[i].y);
  ctx.closePath();
  ctx.fillStyle = body.render.fillStyle || currentTheme.ramp;
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.25)';
  ctx.lineWidth = 2;
  ctx.stroke();
}

function drawFlag() {
  if (!flag) return;
  const x = flag.position.x, y = flag.position.y;
  ctx.save();
  ctx.translate(x, y);
  ctx.strokeStyle = '#d0d8e0';
  ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(0, 45); ctx.lineTo(0, -45); ctx.stroke();
  ctx.fillStyle = '#ff5c6c';
  ctx.beginPath();
  ctx.moveTo(0, -45); ctx.lineTo(34, -32); ctx.lineTo(0, -18);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawCar() {
  if (!carParts) return;
  const skin = getEquippedSkin();
  const { chassis, wheelA, wheelB } = carParts;
  for (const w of [wheelA, wheelB]) {
    ctx.save();
    ctx.translate(w.position.x, w.position.y);
    ctx.rotate(w.angle);
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath(); ctx.arc(0, 0, 14, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#8a8f98';
    ctx.beginPath(); ctx.arc(0, 0, 7, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#3a3f48'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(10, 0); ctx.stroke();
    ctx.restore();
  }
  ctx.save();
  ctx.translate(chassis.position.x, chassis.position.y);
  ctx.rotate(chassis.angle);
  ctx.fillStyle = skin.body;
  ctx.beginPath(); ctx.roundRect(-42, -13, 84, 26, 9); ctx.fill();
  ctx.strokeStyle = skin.accent; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = skin.glass;
  ctx.beginPath(); ctx.roundRect(-16, -10, 22, 14, 4); ctx.fill();
  ctx.fillStyle = '#ff2a2a';
  ctx.beginPath(); ctx.roundRect(-40, -4, 6, 8, 2); ctx.fill();
  ctx.restore();
}

function render() {
  drawBackground();
  ctx.save();
  ctx.translate(canvas.width / 2, canvas.height / 2);
  ctx.scale(CAM_ZOOM, CAM_ZOOM);
  ctx.translate(-camera.x, -camera.y);
  for (const b of staticBodies) { if (b !== flag) drawBody(b); }
  for (const b of world.bodies) {
    if (b.isStatic) continue;
    if (carParts && (b === carParts.chassis || b === carParts.wheelA || b === carParts.wheelB)) continue;
    if (!b.render || b.render.visible === false) continue;
    drawBody(b);
  }
  drawFlag();
  drawCar();
  ctx.restore();
}

let lastTime = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(now - lastTime, 33);
  lastTime = now;
  for (const p of dynamicProps) p.update(now);
  updateFallingPlatforms(now);
  if (gameActive) applyControls();
  Engine.update(engine, dt);
  updateCamera();
  checkWin();
  render();
}

loadLevel(lastLevel);
gameActive = false;
requestAnimationFrame(loop);
</script>
</body>
</html>
